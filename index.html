<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Barrel Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e8edeb;
    --panel:#ffffff;
    --ink:#0d161d;        /* 16:1 on panel */
    --ink-soft:#3a4a54;   /* 8.6:1 on panel */
    --verdigris:#1a6055;  /* 6.2:1 on panel */
    --amber:#8f4f08;      /* 6.7:1 on panel */
    --amber-fill:#e0a444;
    --rule:#c2d0cc;
    --dark:#0d161d;
    --on-dark:#ffffff;
    --on-dark-soft:#c8ded9; /* 11:1 on --dark */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',system-ui,sans-serif;
    font-size:16px;line-height:1.5;
    padding:22px 14px 44px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  .masthead{
    background:var(--dark);border-radius:3px;
    padding:20px 22px;margin-bottom:14px;
  }
  .masthead h1{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:32px;line-height:1.1;
    letter-spacing:-.025em;color:#ffffff;margin:0;
  }
  @media (max-width:380px){ .masthead h1{font-size:27px;} }

  /* presets */
  .presets{display:flex;gap:8px;margin-bottom:14px;}
  .presets button{
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;font-weight:700;
    background:var(--panel);color:var(--ink);
    border:1px solid var(--rule);border-radius:3px;
    padding:11px 6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .presets button small{
    font-family:'Public Sans',sans-serif;
    font-size:10.5px;font-weight:500;letter-spacing:.04em;
    color:var(--ink-soft);text-transform:uppercase;
  }
  .presets button.on{background:var(--verdigris);border-color:var(--verdigris);color:var(--on-dark);}
  .presets button.on small{color:#c8ded9;}
  .presets button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  /* plot + live equation */
  .plotcard{
    background:var(--panel);border:1px solid var(--rule);border-radius:3px;
    padding:10px 8px 6px;margin-bottom:14px;
  }
  svg{display:block;width:100%;height:auto;}

  /* result */
  .result{background:var(--dark);color:var(--on-dark);border-radius:3px;padding:17px 18px;margin-bottom:14px;}
  .result .cap{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--on-dark-soft);margin-bottom:7px;
  }
  .bignum{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em;}
  .bignum em{font-style:normal;font-size:17px;font-weight:500;color:var(--on-dark-soft);margin-left:6px;}
  .subline{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--on-dark-soft);margin-top:8px;}
  .capline{
    margin-top:12px;padding-top:11px;border-top:1px solid #2a3b44;
    font-size:13.5px;color:var(--on-dark-soft);
  }
  .capline b{color:var(--on-dark);font-family:'JetBrains Mono',monospace;}

  /* controls */
  .controls{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:4px 16px 8px;}
  .ctl{padding:12px 0;border-bottom:1px solid var(--rule);}
  .ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;}
  .ctl-name{font-size:14.5px;font-weight:600;color:var(--ink);}
  .ctl-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--rule);outline:none;margin:0;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--panel);border:3px solid var(--verdigris);cursor:pointer;
    box-shadow:0 1px 3px rgba(13,22,29,.3);
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--panel);
    border:3px solid var(--verdigris);cursor:pointer;
  }
  #fillSlider::-webkit-slider-thumb{border-color:var(--amber);}
  #fillSlider::-moz-range-thumb{border-color:var(--amber);}
  input[type=range]:focus-visible{outline:2px solid var(--verdigris);outline-offset:4px;}

  /* disclosure */
  details{border-top:1px solid var(--rule);margin-top:0;}
  details summary{
    list-style:none;cursor:pointer;padding:13px 0 12px;
    font-size:13.5px;font-weight:600;color:var(--verdigris);
    display:flex;align-items:center;gap:7px;
  }
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:'+';font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}
  details[open] summary::before{content:'\2212';}
  details summary:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px;}
  .unitrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;}
  .unitlabel{font-size:14px;color:var(--ink-soft);}
  .seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;}
  .seg button{
    font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
    background:var(--panel);color:var(--ink-soft);border:none;padding:7px 15px;cursor:pointer;
  }
  .seg button.on{background:var(--verdigris);color:var(--on-dark);font-weight:700;}
  .seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}

  .warn{
    margin:10px 0 12px;font-size:13px;color:#7a3a06;
    background:#fbf0e2;border:1px solid #dfbf99;border-radius:3px;
    padding:9px 12px;display:none;line-height:1.5;
  }
  .warn.on{display:block;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead"><h1>Barrel Calculator</h1></header>

  <div class="presets" id="presets">
    <button type="button" data-p="15">15<small>gallon</small></button>
    <button type="button" data-p="25">25<small>gallon</small></button>
    <button type="button" data-p="53" class="on">53<small>gallon</small></button>
  </div>

  <div class="plotcard">
    <svg id="plot" viewBox="0 0 500 350" role="img" aria-label="Barrel shape with bung diameter, head diameter and length"></svg>
  </div>

  <div class="result">
    <div class="cap">Liquid volume</div>
    <div class="bignum"><span id="volMain">0.00</span><em>gal</em></div>
    <div class="subline"><span id="volAlt">0 L</span></div>
    <div class="capline">Full barrel: <b id="capMain">0</b> gal // <b id="capAlt">0</b> L</div>
  </div>

  <div class="warn" id="warnBox"></div>

  <div class="controls">
    <div class="ctl">
      <div class="ctl-head">
        <div class="ctl-name">Fill level</div>
        <div class="ctl-val"><span id="fillVal">33.3</span> %</div>
      </div>
      <input type="range" id="fillSlider" min="0" max="100" step="0.1" value="33.3" aria-label="Fill level">
    </div>

    <div class="ctl">
      <div class="ctl-head">
        <div class="ctl-name">Bung diameter</div>
        <div class="ctl-val"><span id="bungVal">25.5</span> <span class="u">in</span></div>
      </div>
      <input type="range" id="bungSlider" min="4" max="40" step="0.1" value="25.5" aria-label="Bung diameter">
    </div>

    <div class="ctl">
      <div class="ctl-head">
        <div class="ctl-name">Head diameter</div>
        <div class="ctl-val"><span id="headVal">22</span> <span class="u">in</span></div>
      </div>
      <input type="range" id="headSlider" min="1" max="40" step="0.1" value="22" aria-label="Head diameter">
    </div>

    <div class="ctl">
      <div class="ctl-head">
        <div class="ctl-name">Length</div>
        <div class="ctl-val"><span id="lenVal">35</span> <span class="u">in</span></div>
      </div>
      <input type="range" id="lenSlider" min="4" max="60" step="0.1" value="35" aria-label="Barrel length">
    </div>

    <details id="adv">
      <summary>Wood allowance and units</summary>

      <div class="ctl">
        <div class="ctl-head">
          <div class="ctl-name">Stave thickness</div>
          <div class="ctl-val"><span id="staveVal">1</span> <span class="u">in</span></div>
        </div>
        <input type="range" id="staveSlider" min="0" max="2" step="0.0625" value="1" aria-label="Stave thickness">
      </div>

      <div class="ctl">
        <div class="ctl-head">
          <div class="ctl-name">Chime, per end</div>
          <div class="ctl-val"><span id="chimeVal">1.75</span> <span class="u">in</span></div>
        </div>
        <input type="range" id="chimeSlider" min="0" max="4" step="0.25" value="1.75" aria-label="Chime per end">
      </div>

      <div class="unitrow">
        <div class="unitlabel">Measurements in</div>
        <div class="seg">
          <button id="btnIn" class="on" type="button">inches</button>
          <button id="btnCm" type="button">cm</button>
        </div>
      </div>
    </details>
  </div>

</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const IN3_GAL=231, IN3_L=61.0237440947, CM3_GAL=3785.411784, CM3_L=1000;

  let unit='in';

  // exterior tape readings, with the wood allowance for each size
  const PRESETS = {
    15:{bung:17.2, head:15, len:24, t:1, c:1.5},
    25:{bung:20.5, head:17, len:28, t:1, c:1.75},
    53:{bung:25.5, head:22, len:35, t:1, c:1.75}
  };

  // ---------- geometry ----------
  // y(x) = -a(x-h)^2 + b on [0,2h];  b = bung radius, h = L/2, a = (b - rHead)/h^2
  const radiusAt = (x,a,b,h) => b - a*(x-h)*(x-h);
  const fullVolume = (a,b,h) => 2*Math.PI*h*( b*b - (2/3)*a*b*h*h + (1/5)*a*a*Math.pow(h,4) );

  function segmentArea(r, ys){
    if (r<=0 || ys<=-r) return 0;
    if (ys>=r) return Math.PI*r*r;
    return r*r*Math.acos(-ys/r) + ys*Math.sqrt(Math.max(0, r*r-ys*ys));
  }
  function liquidVolume(a,b,h,ys,N){
    N = N || 2000;
    const L=2*h, dx=L/N; let s=0;
    for(let i=0;i<=N;i++){
      const w=(i===0||i===N)?1:(i%2?4:2);
      s += w*segmentArea(radiusAt(i*dx,a,b,h), ys);
    }
    return s*dx/3;
  }

  // ---------- plot ----------
  const NS='http://www.w3.org/2000/svg';
  const el=(n,at)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);return e;};

  function halo(parent,x,y,str,anchor,size,fill){
    const t=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
      'font-family':'JetBrains Mono','font-size':size||11,'font-weight':700,
      fill:fill||'#0d161d',stroke:'#ffffff','stroke-width':4,
      'paint-order':'stroke','stroke-linejoin':'round'});
    t.appendChild(document.createTextNode(str)); parent.appendChild(t);
  }
  function dimLabel(parent,x,y,lines,anchor){
    lines.forEach((str,i)=>halo(parent,x,y+i*13.5,str,anchor));
  }
  function dimV(parent,x,ya,yb){
    parent.appendChild(el('line',{x1:x,y1:ya,x2:x,y2:yb,stroke:'#3a4a54','stroke-width':1.2}));
    [ya,yb].forEach(y=>parent.appendChild(el('line',{x1:x-4.5,y1:y,x2:x+4.5,y2:y,stroke:'#3a4a54','stroke-width':1.2})));
  }
  function dimH(parent,y,xa,xb){
    parent.appendChild(el('line',{x1:xa,y1:y,x2:xb,y2:y,stroke:'#3a4a54','stroke-width':1.2}));
    [xa,xb].forEach(x=>parent.appendChild(el('line',{x1:x,y1:y-4.5,x2:x,y2:y+4.5,stroke:'#3a4a54','stroke-width':1.2})));
  }

  function draw(a,b,h,ys,labB,labH,labL){
    const svg=$('plot');
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const W=500,H=350, L=2*h;
    const cx=W/2, cy=H/2;
    // callout room reserved symmetrically, so the barrel sits dead centre
    const padX=88, padY=62;
    const s=Math.min((cx-padX)/(L/2), (cy-padY)/b);
    const sx=x=>cx+(x-L/2)*s, sy=y=>cy-y*s;
    const rE=radiusAt(0,a,b,h);

    const NP=200, up=[], lo=[];
    for(let i=0;i<=NP;i++){
      const x=L*i/NP, r=radiusAt(x,a,b,h);
      up.push([sx(x),sy(r)]); lo.push([sx(x),sy(-r)]);
    }
    const P=arr=>arr.map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join(' ');

    // ---- barrel interior ----
    let d='M'+sx(0).toFixed(2)+','+sy(rE).toFixed(2);
    up.forEach(q=>{ d+=' L'+q[0].toFixed(2)+','+q[1].toFixed(2); });
    for(let i=lo.length-1;i>=0;i--) d+=' L'+lo[i][0].toFixed(2)+','+lo[i][1].toFixed(2);
    svg.appendChild(el('path',{d:d+' Z',fill:'#1a6055','fill-opacity':.08}));

    // ---- liquid ----
    const fillPts=[];
    for(let i=0;i<=NP;i++){
      const x=L*i/NP, r=radiusAt(x,a,b,h);
      if(-r<ys) fillPts.push([sx(x), sy(Math.max(-r,Math.min(r,ys))), sy(-r)]);
    }
    if(fillPts.length>1){
      let fd='M'+fillPts[0][0].toFixed(2)+','+fillPts[0][1].toFixed(2);
      for(let i=1;i<fillPts.length;i++) fd+=' L'+fillPts[i][0].toFixed(2)+','+fillPts[i][1].toFixed(2);
      for(let i=fillPts.length-1;i>=0;i--) fd+=' L'+fillPts[i][0].toFixed(2)+','+fillPts[i][2].toFixed(2);
      svg.appendChild(el('path',{d:fd+' Z',fill:'#e0a444','fill-opacity':.55}));
    }
    if(ys>-b&&ys<b){
      svg.appendChild(el('line',{x1:sx(0),y1:sy(ys),x2:sx(L),y2:sy(ys),stroke:'#8f4f08','stroke-width':2}));
    }

    // ---- outline, all the way round ----
    svg.appendChild(el('polyline',{points:P(up),fill:'none',stroke:'#1a6055','stroke-width':2.8}));
    svg.appendChild(el('polyline',{points:P(lo),fill:'none',stroke:'#1a6055','stroke-width':2.8}));
    svg.appendChild(el('line',{x1:sx(0),y1:sy(-rE),x2:sx(0),y2:sy(rE),stroke:'#1a6055','stroke-width':2.8}));
    svg.appendChild(el('line',{x1:sx(L),y1:sy(-rE),x2:sx(L),y2:sy(rE),stroke:'#1a6055','stroke-width':2.8}));

    // ---- dimensions ----
    dimV(svg,sx(h),sy(b),sy(-b));
    dimLabel(svg,sx(h)+9,sy(0)-3,['Bung ⌀',fmt(labB)+' '+unit],'start');

    const hx=sx(L)+22;
    dimV(svg,hx,sy(rE),sy(-rE));
    dimLabel(svg,hx+9,sy(0)-3,['Head ⌀',fmt(labH)+' '+unit],'start');

    const ly=sy(-b)+28;
    dimH(svg,ly,sx(0),sx(L));
    dimLabel(svg,(sx(0)+sx(L))/2,ly+19,['Length '+fmt(labL)+' '+unit],'middle');
  }

  // ---------- render ----------
  const fmt = n => String(Math.round(n*1000)/1000);
  const fmt2 = n => n.toFixed(2);

  function render(){
    let Db=parseFloat($('bungSlider').value);
    let Dh=parseFloat($('headSlider').value);
    let Ln=parseFloat($('lenSlider').value);
    const f=parseFloat($('fillSlider').value)/100;
    const t=parseFloat($('staveSlider').value);
    const c=parseFloat($('chimeSlider').value);

    // what the sliders read, kept for the graph labels
    const labB=Db, labH=Math.min(Dh,Db), labL=Ln;

    let msg='';
    Db-=2*t; Dh-=2*t; Ln-=2*c;
    if(Db<=0||Dh<=0||Ln<=0){
      msg='Stave thickness and chime have consumed the whole barrel. Lower t or c.';
      Db=Math.max(Db,.1); Dh=Math.max(Dh,.1); Ln=Math.max(Ln,.1);
    }
    if(Dh>Db){ Dh=Db; msg=msg||'Bung diameter can\u2019t be less than head diameter'; }
    $('warnBox').textContent=msg;
    $('warnBox').classList.toggle('on',!!msg);

    const b=Db/2, h=Ln/2, a=(b-Dh/2)/(h*h);
    const ys=b*(2*f-1);
    const capRaw=fullVolume(a,b,h);
    const liqRaw=liquidVolume(a,b,h,ys);

    const kG = unit==='in'?IN3_GAL:CM3_GAL, kL = unit==='in'?IN3_L:CM3_L;
    const capGal=capRaw/kG;

    $('volMain').textContent=fmt2(liqRaw/kG);
    $('volAlt').textContent=fmt2(liqRaw/kL)+' L';
    $('capMain').textContent=fmt2(capGal);
    $('capAlt').textContent=fmt2(capRaw/kL);


    $('bungVal').textContent=fmt(parseFloat($('bungSlider').value));
    $('headVal').textContent=fmt(parseFloat($('headSlider').value));
    $('lenVal').textContent=fmt(parseFloat($('lenSlider').value));
    $('staveVal').textContent=fmt(t);
    $('chimeVal').textContent=fmt(c);
    $('fillVal').textContent=(f*100).toFixed(1);
    document.querySelectorAll('.u').forEach(e=>e.textContent=unit);

    draw(a,b,h,ys,labB,labH,labL);
  }

  ['bungSlider','headSlider','lenSlider','staveSlider','chimeSlider'].forEach(id=>{
    $(id).addEventListener('input',()=>{ clearPreset(); render(); });
  });
  $('fillSlider').addEventListener('input',render);

  function clearPreset(){
    document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('on'));
  }

  document.querySelectorAll('#presets button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=PRESETS[btn.dataset.p];
      if(unit!=='in') setUnit('in');
      $('bungSlider').value=p.bung; $('headSlider').value=p.head; $('lenSlider').value=p.len;
      $('staveSlider').value=p.t;   $('chimeSlider').value=p.c;
      clearPreset(); btn.classList.add('on');
      render();
    });
  });

  function setUnit(u){
    if(u===unit) return;
    const k=(u==='cm')?2.54:1/2.54;
    ['bungSlider','headSlider','lenSlider','staveSlider','chimeSlider'].forEach(id=>{
      const s=$(id);
      s.min=(parseFloat(s.min)*k).toFixed(3);
      s.max=(parseFloat(s.max)*k).toFixed(3);
      s.step=(parseFloat(s.step)*k).toFixed(4);
      s.value=(parseFloat(s.value)*k).toFixed(3);
    });
    unit=u;
    $('btnIn').classList.toggle('on',u==='in');
    $('btnCm').classList.toggle('on',u==='cm');
    render();
  }
  $('btnIn').addEventListener('click',()=>setUnit('in'));
  $('btnCm').addEventListener('click',()=>setUnit('cm'));

  render();
})();
</script>
</body>
</html>
